<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎀 모모의 뷰티룸</title><style>*{box-sizing:border-box}body{margin:0;background:#fcf3eb;color:#513c50;font:15px/1.6 'Malgun Gothic',system-ui,sans-serif;background-image:radial-gradient(#e8cdd4 1px,transparent 1px);background-size:20px 20px}main{width:min(980px,96%);margin:22px auto;background:#fffaf4;border:2px solid #ddbdc9;border-radius:22px;box-shadow:0 7px #e3c9cd;overflow:hidden}header{background:#f7d4df;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0;letter-spacing:-1px}h2{font-size:20px}a{color:#85425f}button,select{font:inherit;color:inherit;border:1px solid #cba5b7;background:#fff6ed;border-radius:10px;padding:9px 15px;cursor:pointer}button:hover{background:#f9e2ec}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #a74679;outline-offset:3px}button[aria-pressed=true],.primary{background:#a94f78;color:#fff}button:disabled{opacity:.5;cursor:default}.body{padding:22px}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}.stat{padding:8px 15px;background:#f3e7f5;border-radius:12px;font-weight:700}.hint{font-size:13px;color:#786579}.message{min-height:30px;color:#914367;font-weight:700;margin:12px 0}.columns{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}.box{background:#fce9e9;border:1px solid #e6c3ce;border-radius:18px;padding:18px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}canvas{display:block;width:100%;border-radius:14px;touch-action:none;background:#e9e5f5}.touch{display:flex;gap:12px;justify-content:center;margin-top:14px}.touch button{min-height:48px;min-width:64px;touch-action:none;user-select:none}.meter{height:9px;background:#e7d8d7;border-radius:10px;overflow:hidden}.meter i{display:block;height:100%;background:#9fbf91}.tag{font-size:12px;letter-spacing:1px}.hidden{display:none!important}footer{padding:12px 22px;border-top:1px dashed #ddbdc9;font-size:12px;color:#806d78}@media(max-width:650px){.columns{grid-template-columns:1fr}.body{padding:14px}h1{font-size:22px}header{padding:12px}.bar{gap:6px}.stat{padding:6px 9px}button{padding:9px 11px}}</style><main><header><div><span class="tag">LITTLE RETRO ARCADE · 01</span><h1>🎀 모모의 뷰티룸</h1></div><div><a href="index.html">오락실로</a>　<button id="sound">소리 ON</button></div></header><div class="body"><div class="bar"><label>모드 <select id="mode"><option value="mission">스타일 미션</option><option value="free">자유 꾸미기</option></select></label><button id="next">새 미션</button><button id="reset">처음 스타일</button><span class="stat" id="score">완성한 미션 0</span></div><div class="columns"><div class="box" style="background:repeating-linear-gradient(90deg,#f8dce6 0 24px,#ffeced 24px 48px)"><canvas id="portrait" width="440" height="490" aria-label="현재 꾸민 캐릭터">꾸민 캐릭터</canvas></div><div><h2 id="mission"></h2><p class="hint">미션 카드에 맞는 색을 찾아보세요. 자유 꾸미기에서는 원하는 조합을 만들 수 있어요.</p><div id="options"></div><button class="primary" id="finish">♡ 스타일 완성</button> <button id="save">그림 저장</button><div id="result" class="message" role="status"></div></div></div></div><footer>클릭·터치로 헤어, 립, 의상, 소품 선택 · 그림 저장 가능 · 설치 없이 즐기는 오리지널 HTML5 게임</footer></main><script>const $=id=>document.getElementById(id);let audio=null,muted=false;function tone(f=660,d=.08){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}function best(key,n){try{const v=Math.max(Number(localStorage.getItem(key))||0,n);localStorage.setItem(key,v);return v}catch{return n}}$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'소리 OFF':'소리 ON';if(!muted)tone()};

const categories={hair:['헤어',['초코','허니','라벤더'],['#67454c','#c18f62','#79618c']],lip:['립',['로즈','코랄','베리'],['#c55174','#e48464','#9a456f']],dress:['의상',['라일락','민트','피치'],['#c5b0df','#a2cbbb','#e4a4b6']],acc:['소품',['리본','왕관','꽃'],['🎀','👑','🌼']]};let style={hair:0,lip:0,dress:0,acc:0},target={},completed=0,locked=false;const ctx=$('portrait').getContext('2d');
for(const [key,[label,names]] of Object.entries(categories)){const group=document.createElement('div');group.innerHTML='<strong>'+label+'</strong>';const row=document.createElement('div');row.className='choices';names.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.dataset.key=key;b.dataset.value=i;b.onclick=()=>{style[key]=i;draw();tone(400+i*120)};row.append(b)});group.append(row);$('options').append(group)}
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()}
function draw(){ctx.clearRect(0,0,440,490);ctx.fillStyle='#f8e1e9';ctx.fillRect(0,0,440,490);ellipse(220,240,180,222,'#c8ab85');ellipse(220,237,168,210,'#fff7dc');ellipse(220,230,155,195,'#d8ebe6');ellipse(220,227,117,161,categories.hair[2][style.hair]);ellipse(220,440,130,113,categories.dress[2][style.dress]);ellipse(220,328,25,45,'#ffdcc5');ellipse(220,231,88,111,'#ffe0c9');ellipse(184,229,11,17,'#4e3c4a');ellipse(256,229,11,17,'#4e3c4a');ellipse(181,224,3,5,'#fff');ellipse(253,224,3,5,'#fff');ellipse(163,264,22,10,'#f2a9b4');ellipse(277,264,22,10,'#f2a9b4');ellipse(220,287,18,7,categories.lip[2][style.lip]);ellipse(207,142,101,47,categories.hair[2][style.hair]);ctx.fillStyle='#fff7df';ctx.beginPath();ctx.moveTo(190,348);ctx.lineTo(220,380);ctx.lineTo(251,348);ctx.fill();ctx.font='48px sans-serif';ctx.fillText(categories.acc[2][style.acc],276,151);ctx.fillStyle='#7b5471';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('MOMO’S BEAUTY ROOM',220,475);ctx.textAlign='left';document.querySelectorAll('[data-key]').forEach(b=>b.setAttribute('aria-pressed',style[b.dataset.key]===Number(b.dataset.value)))}
function mission(){locked=false;target=Object.fromEntries(Object.keys(categories).map(k=>[k,Math.floor(Math.random()*3)]));$('mission').textContent=$('mode').value==='free'?'나만의 스타일을 만들어요': '오늘의 미션: '+Object.entries(target).map(([k,v])=>categories[k][1][v]).join(' · ');$('result').textContent='';$('finish').disabled=false}
$('finish').onclick=()=>{if($('mode').value==='free'){$('result').textContent='♡ 멋진 스타일 완성! 그림으로 저장해 보세요.';tone();return}const matches=Object.keys(target).filter(k=>style[k]===target[k]).length;if(matches===4){completed++;locked=true;$('finish').disabled=true;$('score').textContent='완성한 미션 '+completed;$('result').textContent='🎉 미션 성공! 새 미션에 도전하세요.';tone(880,.2)}else{$('result').textContent=`${matches}/4 일치! 미션의 색과 소품을 다시 살펴보세요.`;tone(220)}};$('next').onclick=mission;$('mode').onchange=mission;$('reset').onclick=()=>{style={hair:0,lip:0,dress:0,acc:0};draw();mission()};$('save').onclick=()=>{const a=document.createElement('a');a.download='momo-style.png';a.href=$('portrait').toDataURL();a.click()};mission();draw();
</script></html>
