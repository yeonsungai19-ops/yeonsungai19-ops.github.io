<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>☕ 두근두근 카페</title><style>*{box-sizing:border-box}body{margin:0;background:#fcf3eb;color:#513c50;font:15px/1.6 'Malgun Gothic',system-ui,sans-serif;background-image:radial-gradient(#e8cdd4 1px,transparent 1px);background-size:20px 20px}main{width:min(980px,96%);margin:22px auto;background:#fffaf4;border:2px solid #ddbdc9;border-radius:22px;box-shadow:0 7px #e3c9cd;overflow:hidden}header{background:#f7d4df;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0;letter-spacing:-1px}h2{font-size:20px}a{color:#85425f}button,select{font:inherit;color:inherit;border:1px solid #cba5b7;background:#fff6ed;border-radius:10px;padding:9px 15px;cursor:pointer}button:hover{background:#f9e2ec}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #a74679;outline-offset:3px}button[aria-pressed=true],.primary{background:#a94f78;color:#fff}button:disabled{opacity:.5;cursor:default}.body{padding:22px}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}.stat{padding:8px 15px;background:#f3e7f5;border-radius:12px;font-weight:700}.hint{font-size:13px;color:#786579}.message{min-height:30px;color:#914367;font-weight:700;margin:12px 0}.columns{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}.box{background:#fce9e9;border:1px solid #e6c3ce;border-radius:18px;padding:18px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}canvas{display:block;width:100%;border-radius:14px;touch-action:none;background:#e9e5f5}.touch{display:flex;gap:12px;justify-content:center;margin-top:14px}.touch button{min-height:48px;min-width:64px;touch-action:none;user-select:none}.meter{height:9px;background:#e7d8d7;border-radius:10px;overflow:hidden}.meter i{display:block;height:100%;background:#9fbf91}.tag{font-size:12px;letter-spacing:1px}.hidden{display:none!important}footer{padding:12px 22px;border-top:1px dashed #ddbdc9;font-size:12px;color:#806d78}@media(max-width:650px){.columns{grid-template-columns:1fr}.body{padding:14px}h1{font-size:22px}header{padding:12px}.bar{gap:6px}.stat{padding:6px 9px}button{padding:9px 11px}}</style><main><header><div><span class="tag">LITTLE RETRO ARCADE · 04</span><h1>☕ 두근두근 카페</h1></div><div><a href="index.html">오락실로</a>　<button id="sound">소리 ON</button></div></header><div class="body"><div class="bar"><button class="primary" id="start">카페 오픈 / 새 영업</button><button id="pause">일시정지</button><span class="stat" id="time">90초</span><span class="stat" id="money">매출 0원</span><span class="stat" id="served">서빙 0잔</span></div><div id="customers" class="customers"></div><div class="columns"><div class="box"><canvas id="cup" width="400" height="280" aria-label="제조 중인 음료">음료 제조 화면</canvas><div id="mix" class="message">빈 컵</div><button id="clear">컵 비우기</button></div><div><h2>레시피 노트</h2><div id="recipe"></div><h2>재료 선반</h2><div id="ingredients" class="choices"></div><button class="primary" id="serve">🔔 선택한 손님에게 서빙</button><div id="result" class="message" role="status">영업 목표: 90초 안에 8잔! 손님 카드를 눌러 주문을 선택하세요.</div><button id="upgrade">빠른 서비스 업그레이드 · 3,000원</button></div></div><style>.customers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.customer{text-align:left;white-space:normal}.customer strong{display:block}.customer .face{font-size:32px}.customer small{display:block}@media(max-width:450px){.customers{gap:5px}.customer{padding:8px;font-size:12px}}</style></div><footer>재료 순서대로 클릭·터치 → 주문 선택 → 서빙 · 영업 90초 · 8잔 목표 · 설치 없이 즐기는 오리지널 HTML5 게임</footer></main><script>const $=id=>document.getElementById(id);let audio=null,muted=false;function tone(f=660,d=.08){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}function best(key,n){try{const v=Math.max(Number(localStorage.getItem(key))||0,n);localStorage.setItem(key,v);return v}catch{return n}}$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'소리 OFF':'소리 ON';if(!muted)tone()};

const recipes=[{name:'딸기 라테',steps:['우유','딸기','크림'],price:1800},{name:'카페 라테',steps:['에스프레소','우유'],price:1600},{name:'딸기 에이드',steps:['얼음','딸기','탄산수'],price:1700},{name:'아이스 아메리카노',steps:['얼음','에스프레소','물'],price:1400}];const icons={'우유':'🥛','딸기':'🍓','크림':'🍦','얼음':'🧊','에스프레소':'☕','탄산수':'🫧','물':'💧'};let queue=[],selected=0,mix=[],money=0,served=0,remaining=90,running=false,paused=false,upgrade=false,missed=0,clock=0;
for(const [name,icon]of Object.entries(icons)){const b=document.createElement('button');b.textContent=icon+' '+name;b.onclick=()=>{if(!running||paused)return;if(mix.length>=5){$('result').textContent='컵이 가득 찼어요. 비우고 다시 만들어 주세요.';return}mix.push(name);drawCup();tone(400+mix.length*90)};$('ingredients').append(b)}
$('recipe').innerHTML=recipes.map(r=>'<p><strong>'+r.name+'</strong><br><small>'+r.steps.join(' → ')+'</small></p>').join('');
function customer(){return {recipe:recipes[Math.floor(Math.random()*recipes.length)],patience:upgrade?44:32,face:['👩🏻','👨🏻','👩🏽','🧑🏻'][Math.floor(Math.random()*4)]}}
function renderQueue(){const container=$('customers');container.replaceChildren();queue.forEach((p,i)=>{const b=document.createElement('button');b.className='customer';b.setAttribute('aria-pressed',i===selected);b.innerHTML=`<span class="face">${p.face}</span><strong>${p.recipe.name}</strong><small>${i===selected?'선택한 주문':'눌러서 선택'}</small><div class="meter"><i style="width:${Math.min(100,p.patience/(upgrade?44:32)*100)}%"></i></div>`;b.onclick=()=>{selected=i;renderQueue()};container.append(b)})}
function hud(){$('time').textContent=Math.ceil(remaining)+'초';$('money').textContent='매출 '+money.toLocaleString()+'원';$('served').textContent='서빙 '+served+'잔'}
function drawCup(){const x=$('cup').getContext('2d');x.fillStyle='#f8dfd4';x.fillRect(0,0,400,280);x.fillStyle='#e0bca2';x.fillRect(0,235,400,45);x.strokeStyle='#9d7e8a';x.lineWidth=5;x.beginPath();x.moveTo(120,55);x.lineTo(140,232);x.lineTo(260,232);x.lineTo(280,55);x.closePath();x.stroke();const colors={'우유':'#fff5df','딸기':'#e98eaa','크림':'#fffaf2','얼음':'#bde4f5','에스프레소':'#82584b','탄산수':'#c4e5dc','물':'#c8e1ed'};mix.forEach((m,i)=>{x.fillStyle=colors[m];x.fillRect(145,202-i*29,110,27)});x.font='20px sans-serif';x.fillStyle='#8b5468';x.textAlign='center';x.fillText('두근두근 카페',200,30);$('mix').textContent=mix.length?mix.join(' → '):'빈 컵'}
function end(){running=false;const b=best('dugeun-cafe-best',served);$('result').textContent=(served>=8?'🎉 영업 성공!':'오늘 영업 종료! 다시 도전해 보세요.')+` 서빙 ${served}잔 · 놓친 손님 ${missed}명 · 최고 ${b}잔`;tone(880,.25)}
$('start').onclick=()=>{queue=Array.from({length:3},customer);selected=0;mix=[];money=0;served=0;missed=0;remaining=90;running=true;paused=false;upgrade=false;$('pause').textContent='일시정지';$('upgrade').disabled=false;$('upgrade').textContent='빠른 서비스 업그레이드 · 3,000원';renderQueue();drawCup();hud();$('result').textContent='주문 레시피의 순서대로 재료를 눌러 주세요!'};
$('clear').onclick=()=>{mix=[];drawCup()};$('serve').onclick=()=>{if(!running||paused)return;const p=queue[selected];if(mix.join('|')===p.recipe.steps.join('|')){money+=p.recipe.price+Math.floor(p.patience)*10;served++;$('result').textContent='♡ 맛있어요! '+p.recipe.name+' 서빙 성공';queue[selected]=customer();tone(880,.12)}else{p.patience=Math.max(1,p.patience-5);$('result').textContent='레시피와 순서가 달라요! 컵을 비웠으니 다시 만들어 주세요.';tone(180)}mix=[];drawCup();renderQueue();hud()};$('upgrade').onclick=()=>{if(!running||paused||upgrade)return;if(money<3000){$('result').textContent='매출 3,000원이 모이면 업그레이드할 수 있어요.';return}money-=3000;upgrade=true;queue.forEach(p=>p.patience+=12);$('upgrade').disabled=true;$('upgrade').textContent='업그레이드 완료 · 손님 대기시간 증가';hud();renderQueue()};$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'계속하기':'일시정지'};document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){paused=true;$('pause').textContent='계속하기'}});setInterval(()=>{if(!running||paused)return;remaining-=.1;queue.forEach((p,i)=>{p.patience-=.1;if(p.patience<=0){missed++;queue[i]=customer();$('result').textContent='손님이 기다리다 떠났어요. 다음 주문을 준비하세요.'}});if(++clock%5===0)renderQueue();hud();if(remaining<=0){remaining=0;hud();end()}},100);drawCup();
</script></html>
