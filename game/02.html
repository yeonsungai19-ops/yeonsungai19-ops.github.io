<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🧳 구름길 세계여행</title><style>*{box-sizing:border-box}body{margin:0;background:#fcf3eb;color:#513c50;font:15px/1.6 'Malgun Gothic',system-ui,sans-serif;background-image:radial-gradient(#e8cdd4 1px,transparent 1px);background-size:20px 20px}main{width:min(980px,96%);margin:22px auto;background:#fffaf4;border:2px solid #ddbdc9;border-radius:22px;box-shadow:0 7px #e3c9cd;overflow:hidden}header{background:#f7d4df;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0;letter-spacing:-1px}h2{font-size:20px}a{color:#85425f}button,select{font:inherit;color:inherit;border:1px solid #cba5b7;background:#fff6ed;border-radius:10px;padding:9px 15px;cursor:pointer}button:hover{background:#f9e2ec}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #a74679;outline-offset:3px}button[aria-pressed=true],.primary{background:#a94f78;color:#fff}button:disabled{opacity:.5;cursor:default}.body{padding:22px}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}.stat{padding:8px 15px;background:#f3e7f5;border-radius:12px;font-weight:700}.hint{font-size:13px;color:#786579}.message{min-height:30px;color:#914367;font-weight:700;margin:12px 0}.columns{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}.box{background:#fce9e9;border:1px solid #e6c3ce;border-radius:18px;padding:18px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}canvas{display:block;width:100%;border-radius:14px;touch-action:none;background:#e9e5f5}.touch{display:flex;gap:12px;justify-content:center;margin-top:14px}.touch button{min-height:48px;min-width:64px;touch-action:none;user-select:none}.meter{height:9px;background:#e7d8d7;border-radius:10px;overflow:hidden}.meter i{display:block;height:100%;background:#9fbf91}.tag{font-size:12px;letter-spacing:1px}.hidden{display:none!important}footer{padding:12px 22px;border-top:1px dashed #ddbdc9;font-size:12px;color:#806d78}@media(max-width:650px){.columns{grid-template-columns:1fr}.body{padding:14px}h1{font-size:22px}header{padding:12px}.bar{gap:6px}.stat{padding:6px 9px}button{padding:9px 11px}}</style><main><header><div><span class="tag">LITTLE RETRO ARCADE · 02</span><h1>🧳 구름길 세계여행</h1></div><div><a href="index.html">오락실로</a>　<button id="sound">소리 ON</button></div></header><div class="body"><div class="bar"><span class="stat" id="world">SEOUL</span><span class="stat" id="hearts">♡ ♡ ♡</span><span class="stat" id="cards">엽서 0 / 5</span><button class="primary" id="start">여행 시작 / 다시 시작</button><button id="pause">일시정지</button></div><canvas id="game" width="900" height="420" aria-label="세계여행 점프 게임">방향키로 이동, 스페이스로 점프</canvas><div class="touch"><button id="left" aria-label="왼쪽 이동">◀</button><button id="right" aria-label="오른쪽 이동">▶</button><button id="jump">점프 ↑</button></div><div class="message" id="result" role="status">여행 시작을 누르세요. 엽서 5장을 모아 오른쪽 여행 가방에 도착하세요.</div></div><footer>방향키 ← → 이동 · ↑ 또는 스페이스 점프 · 휴대폰은 화면 버튼 사용 · 3개 도시 · 설치 없이 즐기는 오리지널 HTML5 게임</footer></main><script>const $=id=>document.getElementById(id);let audio=null,muted=false;function tone(f=660,d=.08){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}function best(key,n){try{const v=Math.max(Number(localStorage.getItem(key))||0,n);localStorage.setItem(key,v);return v}catch{return n}}$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'소리 OFF':'소리 ON';if(!muted)tone()};

const c=$('game'),x=c.getContext('2d'),keys={};let running=false,paused=false,level=0,lives=3,collected=0,cam=0,last=0,player,plats,postcards;const cities=['SEOUL · 서울','PARIS · 파리','CAIRO · 카이로'];
function setup(){player={x:55,y:270,vx:0,vy:0,w:30,h:46,ground:false};plats=[[0,350,340],[410,350,240],[720,310,210],[1010,350,260],[1350,310,190],[1630,350,300],[2010,350,350]].map(([x,y,w])=>({x,y,w}));postcards=[{x:245,y:302},{x:550,y:302},{x:825,y:262},{x:1440,y:262},{x:1820,y:302}].map(p=>({...p,got:false}));cam=0;collected=0;hud()}
function hud(){$('world').textContent=cities[level];$('hearts').textContent='♥ '.repeat(lives);$('cards').textContent='엽서 '+collected+' / 5'}
function jump(){if(running&&!paused&&player.ground){player.vy=-600;player.ground=false;tone(500)}}
function finish(message){running=false;$('result').textContent=message}
function tick(dt){if(!running||paused)return;player.vx=((keys.right?1:0)-(keys.left?1:0))*260;player.x=Math.max(0,Math.min(2310,player.x+player.vx*dt));const old=player.y;player.vy+=1500*dt;player.y+=player.vy*dt;player.ground=false;for(const p of plats)if(player.x+player.w>p.x&&player.x<p.x+p.w&&old+player.h<=p.y+1&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.ground=true}for(const p of postcards)if(!p.got&&Math.abs(player.x+15-p.x)<34&&Math.abs(player.y+23-p.y)<46){p.got=true;collected++;hud();tone(780)}if(player.y>470){lives--;hud();if(!lives){finish('여행 종료! 다시 시작해 새로운 여행을 떠나세요.');return}player.x=55;player.y=270;player.vy=0;$('result').textContent='앗, 발을 헛디뎠어요! 모은 엽서는 유지됩니다.'}if(player.x>2180){if(collected<5){$('result').textContent='엽서를 모두 모아야 출발할 수 있어요! 왼쪽도 살펴보세요.'}else if(level<2){level++;setup();$('result').textContent='✈ 다음 도시 도착! '+cities[level];tone(1000,.25)}else finish('🎉 세계여행 완주! 서울·파리·카이로 엽서 15장을 모았어요.')}cam=Math.max(0,Math.min(1460,player.x-300))}
function draw(){x.fillStyle=['#cfe9ef','#d7edf2','#f9dfbb'][level];x.fillRect(0,0,900,420);x.fillStyle='#fff9ec';for(let i=0;i<6;i++){x.beginPath();x.ellipse((i*220-cam*.2+1100)%1200-100,80+(i%2)*30,65,22,0,0,7);x.fill()}x.fillStyle=['#9cbec0','#a5b6d0','#ddbc8d'][level];if(level===0){for(let i=0;i<6;i++){x.fillRect(i*180-cam*.1,220,120,150);x.beginPath();x.moveTo(i*180-10-cam*.1,220);x.lineTo(i*180+60-cam*.1,175);x.lineTo(i*180+130-cam*.1,220);x.fill()}}else if(level===1){x.beginPath();x.moveTo(600-cam*.1,70);x.lineTo(500-cam*.1,350);x.lineTo(700-cam*.1,350);x.closePath();x.fill()}else{for(let i=0;i<3;i++){x.beginPath();x.moveTo(i*340-cam*.1,350);x.lineTo(i*340+150-cam*.1,130);x.lineTo(i*340+300-cam*.1,350);x.fill()}}for(const p of plats){x.fillStyle='#bd9c80';x.fillRect(p.x-cam,p.y,p.w,420-p.y);x.fillStyle='#99bb8f';x.fillRect(p.x-cam,p.y,p.w,14)}x.font='28px sans-serif';for(const p of postcards)if(!p.got)x.fillText('💌',p.x-cam-14,p.y+12);x.font='48px sans-serif';x.fillText('🧳',2230-cam,350);if(player){const px=player.x-cam,py=player.y;x.fillStyle='#e5ad57';x.beginPath();x.roundRect(px,py+19,30,25,7);x.fill();x.fillStyle='#ffe0c9';x.beginPath();x.arc(px+15,py+12,14,0,7);x.fill();x.fillStyle='#9d5d65';x.fillRect(px-2,py-2,35,8);x.fillStyle='#559b9b';x.fillRect(px-7,py+20,9,20);x.fillStyle='#654c56';x.fillRect(px+3,py+41,8,6);x.fillRect(px+20,py+41,8,6)}if(paused){x.fillStyle='#513c50bb';x.fillRect(0,0,900,420);x.fillStyle='#fff';x.font='30px sans-serif';x.fillText('잠시 쉬는 중',350,220)}}
function loop(t){const dt=Math.min((t-last)/1000||0,.025);last=t;tick(dt);draw();requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)){e.preventDefault();if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;if(e.code==='Space'||e.code==='ArrowUp')jump()}});document.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false});window.addEventListener('blur',()=>{keys.left=keys.right=false;if(running){paused=true;$('pause').textContent='계속하기'}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){paused=true;$('pause').textContent='계속하기'}});for(const k of ['left','right']){$(k).onpointerdown=e=>{e.preventDefault();$(k).setPointerCapture(e.pointerId);keys[k]=true};$(k).onpointerup=$(k).onpointercancel=()=>keys[k]=false}$('jump').onpointerdown=e=>{e.preventDefault();jump()};$('start').onclick=()=>{level=0;lives=3;paused=false;running=true;setup();$('pause').textContent='일시정지';$('result').textContent='엽서를 모으며 오른쪽으로! 구름길의 틈은 점프로 건너세요.'};$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'계속하기':'일시정지'};setup();requestAnimationFrame(loop);
</script></html>
