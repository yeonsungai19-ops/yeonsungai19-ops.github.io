<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🌟 별사탕 비트</title><style>*{box-sizing:border-box}body{margin:0;background:#fcf3eb;color:#513c50;font:15px/1.6 'Malgun Gothic',system-ui,sans-serif;background-image:radial-gradient(#e8cdd4 1px,transparent 1px);background-size:20px 20px}main{width:min(980px,96%);margin:22px auto;background:#fffaf4;border:2px solid #ddbdc9;border-radius:22px;box-shadow:0 7px #e3c9cd;overflow:hidden}header{background:#f7d4df;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0;letter-spacing:-1px}h2{font-size:20px}a{color:#85425f}button,select{font:inherit;color:inherit;border:1px solid #cba5b7;background:#fff6ed;border-radius:10px;padding:9px 15px;cursor:pointer}button:hover{background:#f9e2ec}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #a74679;outline-offset:3px}button[aria-pressed=true],.primary{background:#a94f78;color:#fff}button:disabled{opacity:.5;cursor:default}.body{padding:22px}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}.stat{padding:8px 15px;background:#f3e7f5;border-radius:12px;font-weight:700}.hint{font-size:13px;color:#786579}.message{min-height:30px;color:#914367;font-weight:700;margin:12px 0}.columns{display:grid;grid-template-columns:1.1fr 1fr;gap:22px}.box{background:#fce9e9;border:1px solid #e6c3ce;border-radius:18px;padding:18px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}canvas{display:block;width:100%;border-radius:14px;touch-action:none;background:#e9e5f5}.touch{display:flex;gap:12px;justify-content:center;margin-top:14px}.touch button{min-height:48px;min-width:64px;touch-action:none;user-select:none}.meter{height:9px;background:#e7d8d7;border-radius:10px;overflow:hidden}.meter i{display:block;height:100%;background:#9fbf91}.tag{font-size:12px;letter-spacing:1px}.hidden{display:none!important}footer{padding:12px 22px;border-top:1px dashed #ddbdc9;font-size:12px;color:#806d78}@media(max-width:650px){.columns{grid-template-columns:1fr}.body{padding:14px}h1{font-size:22px}header{padding:12px}.bar{gap:6px}.stat{padding:6px 9px}button{padding:9px 11px}}</style><main><header><div><span class="tag">LITTLE RETRO ARCADE · 05</span><h1>🌟 별사탕 비트</h1></div><div><a href="index.html">오락실로</a>　<button id="sound">소리 ON</button></div></header><div class="body"><div class="bar"><label>곡 <select id="song"><option value="0">별빛 산책 · 90 BPM</option><option value="1">달콤한 오후 · 120 BPM</option></select></label><button class="primary" id="start">연주 시작 / 재시작</button><button id="pause">일시정지</button><span id="score" class="stat">점수 0</span><span id="combo" class="stat">콤보 0</span></div><canvas id="game" width="780" height="480" aria-label="D F J K 네 줄 리듬 게임">별이 아래 판정선에 도착하면 D F J K를 누르세요.</canvas><div class="touch" id="pads"><button data-lane="0">D</button><button data-lane="1">F</button><button data-lane="2">J</button><button data-lane="3">K</button></div><div id="result" class="message" role="status">별이 아래 선에 닿을 때 D · F · J · K 또는 화면 버튼을 눌러보세요.</div></div><footer>D · F · J · K 또는 터치 버튼 · 64개 노트 · 오리지널 합성음 멜로디 · 탭을 벗어나면 자동 일시정지 · 설치 없이 즐기는 오리지널 HTML5 게임</footer></main><script>const $=id=>document.getElementById(id);let audio=null,muted=false;function tone(f=660,d=.08){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}function best(key,n){try{const v=Math.max(Number(localStorage.getItem(key))||0,n);localStorage.setItem(key,v);return v}catch{return n}}$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'소리 OFF':'소리 ON';if(!muted)tone()};

const ctx=$('game').getContext('2d'),melody=[0,2,4,7,4,2,0,2,4,5,7,9,7,4,2,0],freq=[261.63,293.66,329.63,349.23,392,440,493.88];let notes=[],running=false,paused=false,elapsed=0,score=0,combo=0,maxCombo=0,judged=0,hits=0,beat=.666,duration=0,last=0,played=-1,feedback='READY',flash=[0,0,0,0];
function makeChart(){beat=60/($('song').value==='0'?90:120);notes=Array.from({length:64},(_,i)=>({time:2+i*beat,lane:[0,1,2,1,3,2,0,3,1,0,2,3,2,1,3,0][i%16],done:false}));duration=notes.at(-1).time+2}
function updateHud(){$('score').textContent='점수 '+score.toLocaleString();$('combo').textContent='콤보 '+combo}
function hit(lane){if(!running||paused)return;flash[lane]=.15;const n=notes.filter(n=>!n.done&&n.lane===lane&&Math.abs(n.time-elapsed)<.19).sort((a,b)=>Math.abs(a.time-elapsed)-Math.abs(b.time-elapsed))[0];if(n){n.done=true;judged++;hits++;combo++;maxCombo=Math.max(maxCombo,combo);const perfect=Math.abs(n.time-elapsed)<.085;score+=perfect?1000:600;feedback=perfect?'PERFECT!':'GOOD!';tone([523,587,659,784][lane],.06)}else{combo=0;feedback='TOO EARLY';tone(160,.04)}updateHud()}
function finish(){running=false;const b=best('candy-beat-'+$('song').value,score);$('result').textContent=`🎵 연주 완료! ${hits}/64 성공 · 최대 콤보 ${maxCombo} · 최고점 ${b.toLocaleString()}`;feedback='FINISH!'}
function draw(){ctx.fillStyle='#342e56';ctx.fillRect(0,0,780,480);const colors=['#efaecb','#f3d487','#bca8e6','#a6d8e8'];for(let i=0;i<4;i++){ctx.fillStyle=flash[i]>0?'#6c5788':i%2?'#40355f':'#493c6b';ctx.fillRect(110+i*140,35,136,408);ctx.fillStyle=colors[i];ctx.font='22px sans-serif';ctx.fillText(['D','F','J','K'][i],165+i*140,468)}ctx.fillStyle='#ffdf8f';ctx.fillRect(110,388,556,4);for(const n of notes){if(n.done)continue;const y=390-(n.time-elapsed)*180;if(y<30||y>430)continue;const cx=178+n.lane*140;ctx.fillStyle=colors[n.lane];ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?12:25;const px=cx+Math.cos(a)*r,py=y+Math.sin(a)*r;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();ctx.fill()}ctx.fillStyle='#fff4df';ctx.textAlign='center';ctx.font='26px sans-serif';ctx.fillText(paused?'PAUSED':feedback,390,25);ctx.font='13px sans-serif';ctx.fillText(Math.floor(elapsed)+' / '+Math.ceil(duration)+'초',725,245);ctx.textAlign='left'}
function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;if(running&&!paused){elapsed+=dt;for(let i=0;i<4;i++)flash[i]=Math.max(0,flash[i]-dt);for(const n of notes)if(!n.done&&elapsed-n.time>.19){n.done=true;judged++;combo=0;feedback='MISS';updateHud()}const beatIndex=Math.floor((elapsed-2)/beat);if(beatIndex>=0&&beatIndex<64&&beatIndex!==played){played=beatIndex;const semitone=melody[beatIndex%16];tone(261.63*Math.pow(2,semitone/12),beat*.6)}if(elapsed>duration)finish()}draw();requestAnimationFrame(loop)}
$('start').onclick=()=>{tone(523);makeChart();running=true;paused=false;elapsed=0;played=-1;score=combo=maxCombo=hits=judged=0;feedback='READY';$('pause').textContent='일시정지';$('result').textContent='별이 판정선에 닿는 순간 키를 누르세요!';updateHud()};$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'계속하기':'일시정지'};document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){paused=true;$('pause').textContent='계속하기'}});window.addEventListener('blur',()=>{if(running){paused=true;$('pause').textContent='계속하기'}});document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;const lane=['KeyD','KeyF','KeyJ','KeyK'].indexOf(e.code);if(lane>=0){e.preventDefault();if(!e.repeat)hit(lane)}});document.querySelectorAll('[data-lane]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();hit(Number(b.dataset.lane))});makeChart();draw();requestAnimationFrame(loop);
</script></html>
